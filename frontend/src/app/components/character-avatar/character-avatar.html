<figure class="character-avatar">
  <div class="character-avatar__face character-avatar__face--{{ mood() }}">
    <span class="character-avatar__emoji" aria-hidden="true">{{ character().avatar }}</span>
    <span class="character-avatar__mood" aria-hidden="true">{{ moodIcon() }}</span>
  </div>

  <figcaption>
    <strong>{{ character().name }}</strong>
    <span>{{ character().role }}</span>
    <span class="visually-hidden">, humeur : {{ moodLabel() }}</span>
  </figcaption>

  @if (thinking()) {
    <div class="character-avatar__thinking" role="status" aria-label="{{ character().name }} réfléchit">
      <span></span><span></span><span></span>
    </div>
  }
</figure>
