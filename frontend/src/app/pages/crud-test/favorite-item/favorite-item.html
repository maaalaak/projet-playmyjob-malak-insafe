<article class="favorite-item">
  <div>
    <a [href]="favorite.offer.url" target="_blank" rel="noopener">{{ favorite.offer.title }}</a>
    <p>{{ favorite.offer.company }} · {{ favorite.offer.city }}</p>
    <small>Modifié le {{ favorite.updatedAt | date: 'dd/MM/yyyy HH:mm:ss' }}</small>
  </div>

  <form class="favorite-item__form" [formGroup]="noteForm" (ngSubmit)="save()">
    <input type="text" placeholder="Note perso" formControlName="note" />
    <button type="submit" [disabled]="note.invalid || note.pristine">Modifier (PUT)</button>
    <button type="button" (click)="remove()">Supprimer (DELETE)</button>
  </form>

  @if (note.hasError('maxlength')) {
    <p class="favorite-item__error">La note ne doit pas dépasser {{ noteMaxLength }} caractères.</p>
  }
</article>
