<aside class="contact-list">
  <h2 class="contact-list__title">Équipe</h2>
  <ul>
    @for (character of characters; track character.id) {
      <li class="contact-list__item" [class.contact-list__item--active]="character.id === activeCharacterId">
        <span class="contact-list__avatar">{{ character.avatar }}</span>
        <span>
          <strong>{{ character.name }}</strong>
          <small>{{ character.id === typingCharacterId ? 'écrit…' : character.role }}</small>
        </span>
      </li>
    }
  </ul>
</aside>
